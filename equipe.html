<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Equipe — Vert Genèse</title>
<link rel="icon" type="image/png" href="imagens/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main>
<div class="pagehead"><div class="wrap"><h1>Equipe</h1><p>Quem executa os projetos.</p></div></div>
<section><div class="wrap"><div class="people" id="lista-equipe"></div></div></section>
</main>
<script src="dados.js"></script>
<script>
function montaPagina(){
  document.getElementById("lista-equipe").innerHTML = EQUIPE.map(function(p){
    return '<div class="person"><h3>'+esc(p.nome)+'</h3><div class="role">'+esc(p.cargo)+'</div>'+
      '<p>'+esc(p.resumo)+'</p>'+
      (p.linkedin ? '<p><a href="'+esc(p.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a></p>' : '')+'</div>';
  }).join("");
}
</script>
<script src="site.js"></script>
</body>
</html>
